version: 3.7.0
name: world_flags
description: The first and only collection of declaratively defined world flags. No assets.
maintainer: Roman Cinis
repository: https://github.com/tsinis/sealed_world/tree/main/packages/world_flags
issue_tracker: https://github.com/tsinis/sealed_world/issues
homepage: https://tsin.is/sealed_world/#/country/gbr/settings

resolution: workspace

topics:
  - flags
  - flag
  - country-flags
  - country-flag
  - coat-of-arms

screenshots:
  - description: "Example of usage"
    path: doc/example.webp

# This package supports all official Flutter platforms:
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Material is no longer a part of Flutter SDK (deprecated in Flutter 3.50).
  material_ui: ^1.11.0 # Only for the deprecated FlagThemeData (ThemeExtension).
  sealed_countries: ^3.4.2

dev_dependencies:
  dart_code_metrics_presets: any # Constrained in the workspace pubspec.yaml
  flutter_test: # From Google
    sdk: flutter
  gleon: ^0.6.1 # Golden tests with tolerance (shader flags), platform-aware.
  skills_lint: any # Constrained in the workspace pubspec.yaml

flutter:
  shaders:
    - shaders/waved_flag.frag
