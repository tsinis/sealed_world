version: 4.8.0
name: world_countries
description: Sealed world data in form of Flutter widgets (country, phone, currency pickers, etc.).
maintainer: Roman Cinis
repository: https://github.com/tsinis/sealed_world/tree/main/packages/world_countries
issue_tracker: https://github.com/tsinis/sealed_world/issues
homepage: https://tsin.is/sealed_world/

resolution: workspace

topics:
  - picker
  - country-picker
  - country-selector
  - currency-picker
  - language-picker

screenshots:
  - description: "Use with SearchAnchor widget"
    path: doc/search_anchor.webp
  - description: "Search picker example"
    path: doc/search_picker.webp
  - description: "Modal bottom sheet picker example"
    path: doc/modal_picker.webp

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Material is no longer a part of Flutter SDK (deprecated in Flutter 3.50).
  material_ui: ^1.11.0 # Pickers, search bars and themes are Material widgets.
  meta: ^1.19.0 # Same as in Flutter 3.50 SDK (flutter and flutter_test).
  world_flags: ^3.6.0

dev_dependencies:
  dart_code_metrics_presets: any # Constrained in the workspace pubspec.yaml
  flutter_test: # From Google
    sdk: flutter
  skills_lint: any # Constrained in the workspace pubspec.yaml

flutter:
  uses-material-design: true # Pickers using the Material icon font.
