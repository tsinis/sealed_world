include: ../packages/analysis_options.yaml

analyzer:
  exclude:
    # Copied into the l10n_* packages (lower SDK constraint) and linted there.
    - lib/l10n/templates/**

linter:
  rules:
    public_member_api_docs: false
    curly_braces_in_flow_control_structures: false

dart_code_metrics:
  rules:
    - prefer-moving-to-variable:
        allowed-duplicated-chains: 3
