name: verify_package_workflow

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      is_flutter:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  verify-package:
    env:
      relative_path: packages/${{ inputs.package_name }}
    name: ⏳ Verify ${{ inputs.package_name }} Package
    defaults:
      run:
        working-directory: ${{ env.relative_path }}

    runs-on: "ubuntu-latest"
    timeout-minutes: 20

    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v7.0.1

      - name: 🧹 Workspace cleaner
        if: ${{ !inputs.is_flutter }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const f = 'pubspec.yaml', c = await require('fs').promises.readFile(f, 'utf8')
            await require('fs').promises.writeFile(f, c.replace(/- packages\/world_/g, '#'))

      - name: Pull Baselines
        if: ${{ inputs.is_flutter }}
        id: gleon
        background: true
        uses: tsinis/gleon@f0bc3fe71815eabc6b1f1ed94f29ac4c8a72a143
        with:
          version: "v0.1.0"
          checksum: "9b8121fae8e4be91188da15169a91a2d5adcb286216e356e724ea74fb2157d5f"
          command: "pull"
          working-directory: ${{ env.relative_path }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GLEON_STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: 🎯 Setup Dart
        if: ${{ !inputs.is_flutter }}
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: "stable"

      - name: 🐦 Setup Flutter
        if: ${{ inputs.is_flutter }}
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          channel: "stable"
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 📦 Install dependencies
        run: dart pub upgrade

      - name: 📝 Test documentation code samples
        working-directory: tools
        run: dart run bin/test_docs.dart ${{ inputs.package_name }}

      - name: 🕵️ Analyze code
        id: analyze
        uses: ValentinVignal/action-dart-analyze@v2.2
        if: ${{ github.event_name == 'pull_request' }}
        background: true
        with:
          fail-on: "note"
          fail-on-format: true
          format: true
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ env.relative_path }}

      - name: 🏜️ Publish - dry run
        if: ${{ github.event_name == 'pull_request' }}
        run: dart pub publish --dry-run

      - name: 🧮 Check PANA score
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          sudo apt-get install webp
          dart pub global activate pana
          if [ "${{ inputs.is_flutter }}" = "true" ]; then
            dart pub global run pana . --no-warning --exit-code-threshold 0 --flutter-sdk $FLUTTER_ROOT
          else
            dart pub global run pana . --no-warning --exit-code-threshold 0
          fi

      - name: 📥 Install DCM
        if: ${{ github.event_name == 'pull_request' }}
        uses: CQLabs/setup-dcm@v2.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔎 Dart Code Metrics (Author)
        id: dcm
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'tsinis' }}
        uses: CQLabs/dcm-action@v2.0.4
        background: true
        with:
          ci-key: oss
          email: oss
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: ${{ inputs.package_name }}
          folders: ${{ env.relative_path }}
          exclude: "**/example/**/*.dart"
          fatal-found: true
          analyze-assets: true
          check-exports-completeness: true
          check-unused-files: ${{ inputs.is_flutter }}

      - name: 🔎 Dart Code Metrics (Fork)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'tsinis' }}
        background: true
        run: dcm analyze . --verbose --fatal-style --fatal-warnings --reporter=github

      - name: 🛂 Set up file system write permissions
        run: sudo chown -R runner:runner $(pwd) && sudo chmod -R 777 $(pwd)

      - name: 🧪 Run Dart tests
        if: ${{ !inputs.is_flutter }}
        run: dart run coverage:test_with_coverage --fail-under=40

      - name: 🔬 Run Flutter tests (Generate Goldens)
        if: ${{ inputs.is_flutter }}
        # Always use --update-goldens! Gleon will handle the diffing.
        run: flutter test --coverage --no-pub --update-goldens

      - name: ⏳ Wait for gleon Pull
        wait: [gleon]

      - name: Run Gleon Diff
        if: ${{ inputs.is_flutter }}
        uses: tsinis/gleon@f0bc3fe71815eabc6b1f1ed94f29ac4c8a72a143
        with:
          version: "v0.1.0"
          checksum: "9b8121fae8e4be91188da15169a91a2d5adcb286216e356e724ea74fb2157d5f"
          working-directory: ${{ env.relative_path }}

      - name: Post PR Summary
        if: ${{ inputs.is_flutter && failure() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gleon report --pr=${{ github.event.pull_request.number }}
        working-directory: ${{ env.relative_path }}

      - name: Upload Diff Artifacts (For Approval)
        if: ${{ inputs.is_flutter && failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          # Include the PR number in the artifact name so the approve workflow can find it
          name: gleon-diffs-${{ github.event.pull_request.number }}-${{ inputs.package_name }}
          path: ${{ env.relative_path }}/.gleon/diffs/
          retention-days: 7

      - name: ⏳ Wait for Analyze and DCM
        wait: [analyze, dcm]

      - name: 📊 Check code coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
        with:
          path: ${{ env.relative_path }}/coverage/lcov.info
          exclude: "**/*.data.dart **/*.l10n.dart"
          min_coverage: 99

      - name: 💯 Upload coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.relative_path }}/coverage/lcov.info
          flags: ${{ inputs.package_name }}
          name: ${{ inputs.package_name }}
          override_branch: ${{ github.base_ref }}
          verbose: true
