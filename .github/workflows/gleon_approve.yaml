name: gleon_approve

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  approve:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/gleon approve')
    uses: tsinis/gleon/.github/workflows/approve.yml@main
    with:
      version: "v0.2.1"
      working-directory: packages/world_flags
      trigger-workflow: "verify_packages.yaml"
    secrets: inherit
