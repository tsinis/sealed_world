name: verify_packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**/*.dart"
      - "packages/**/*.yaml"
      - "packages/**/*.frag"
      - "tools/bin/l10n_mapper.dart"
      - "tools/lib/l10n/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/**/*.dart"
      - "packages/**/*.yaml"
      - "packages/**/*.frag"
      - "tools/bin/l10n_mapper.dart"
      - "tools/lib/l10n/**"
      - ".github/workflows/verify_packages.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-packages:
    name: 🔍 Detect Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 Find Changed Packages
        id: set-packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: |
          # A push may have no previous commit (e.g. after a force push).
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || BASE_SHA="HEAD^"

          # Changes since the branch point only, and only code and configs need
          # the checks (e.g. not a CHANGELOG or README).
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- packages)
          CHANGED=$(grep -E '\.(dart|yaml|frag)$' <<< "$CHANGED" || true)

          PACKAGES=$(grep -E '^packages/[^/]+/' <<< "$CHANGED" | cut -d'/' -f2 || true)

          # Shared configs are used by every package, but a Flutter config only
          # by the packages that include it.
          if grep -E '^packages/[^/]+\.yaml$' <<< "$CHANGED" | grep -qvE '^packages/flutter_'; then
            PACKAGES=$(find packages -mindepth 2 -maxdepth 2 -name pubspec.yaml \
              | cut -d'/' -f2 || true)
          else
            for CONFIG in $(grep -E '^packages/flutter_[^/]+\.yaml$' <<< "$CHANGED" || true); do
              PACKAGES+=$'\n'$(grep -l "include: ../${CONFIG#packages/}" \
                packages/*/analysis_options.yaml | cut -d'/' -f2 || true)
            done
          fi

          # The l10n_* mapper is generated from tools, so its generator and
          # templates are checked (by regenerating) in every l10n_* package.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" -- tools/bin/l10n_mapper.dart tools/lib/l10n | grep -q .; then
            PACKAGES+=$'\n'$(find packages -mindepth 1 -maxdepth 1 -type d -name 'l10n_*' | cut -d'/' -f2)
          fi

          # A removed package has nothing left to verify.
          PACKAGES=$(sort -u <<< "$PACKAGES" | while read -r PACKAGE; do
            if [ -f "packages/$PACKAGE/pubspec.yaml" ]; then echo "$PACKAGE"; fi
          done)

          PACKAGES=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$PACKAGES")
          echo "Changed packages: $PACKAGES"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  verify-packages:
    name: 🛡️ Verify ${{ matrix.package }}
    needs: detect-packages
    if: fromJson(needs.detect-packages.outputs.packages)[0] != null
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.packages) }}
    uses: ./.github/workflows/verify_package_workflow.yaml
    with:
      package_name: ${{ matrix.package }}
      is_flutter: ${{ contains(matrix.package, 'world_') }}
    secrets: inherit
