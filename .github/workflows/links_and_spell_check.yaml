name: links_and_spell_check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  spell-check:
    name: 🔗🪄 Check Links & Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📚 Git checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔗 Link checker
        uses: tcort/github-action-markdown-link-check@v1.1.3
        if: false # TODO(tsinis): replace this one with different link checker.
        with:
          base-branch: main
          use-quiet-mode: "yes"
          check-modified-files-only: "yes"
          config-file: .github/workflows/config/link-checker.json

      - name: 🪄 Spell check
        uses: streetsidesoftware/cspell-action@v9.0.1
        with:
          config: .github/workflows/config/spell-check/cspell.json
          incremental_files_only: true
          files: "**/*.{md,dart}"
